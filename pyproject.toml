[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    ".venv",
    "venv",
    "htmlcov",
    ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]
"__init__.py" = ["F401"]
